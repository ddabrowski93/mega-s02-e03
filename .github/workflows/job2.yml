name: MEGA job 2 (remote only)

on:
  workflow_dispatch:
    inputs:
      approve_openrouter:
        description: 'Approve sending transcript/skill to OpenRouter and its provider: max 2 GPT-4.1-mini requests, max $1 provider budget, plus remote memo writes/submit'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mega-job2
  cancel-in-progress: false

jobs:
  job2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Require explicit inference approval
        env:
          APPROVED: ${{ inputs.approve_openrouter }}
        run: test "$APPROVED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline synthetic unit tests (no credentials)
        run: python3 -B -m unittest discover -s tests -v
      - name: Execute job on this GitHub-hosted runner
        timeout-minutes: 15
        env:
          MEGA_JOB2_URL: ${{ secrets.MEGA_JOB2_URL }}
          MEGA_RESULT_CERT: ${{ vars.MEGA_RESULT_CERT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MEGA_APPROVE_OPENROUTER: ${{ inputs.approve_openrouter }}
        run: python3 -B worker/job2.py
      - name: Upload encrypted result and value-free audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job2-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            job2-output/result.cms
            job2-output/audit.jsonl
          if-no-files-found: warn
          retention-days: 3
